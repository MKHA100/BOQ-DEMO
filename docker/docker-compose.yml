services:
  backend:
    build:
      context: ../backend
    environment:
      STORAGE_ROOT: /app/storage_data
      DATABASE_PATH: /app/storage_data/app.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - backend-storage:/app/storage_data
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      STORAGE_ROOT: /app/storage_data
      DATABASE_PATH: /app/storage_data/app.db
    volumes:
      - backend-storage:/app/storage_data
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-storage:
